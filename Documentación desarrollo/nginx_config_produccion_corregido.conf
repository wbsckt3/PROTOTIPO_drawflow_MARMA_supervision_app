# ============================================================
# API Backend - TechGuard Pro (con Let's Encrypt SSL válido)
# VERSIÓN CORREGIDA: Pasa OPTIONS al backend, sin duplicar headers CORS
# ============================================================

# --- Redirección HTTP → HTTPS ---
server {
    listen 80;
    server_name api.techguard.pro;
    return 301 https://$host$request_uri;
}

# --- Servidor HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.techguard.pro;

    # Certificado emitido por Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/api.techguard.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.techguard.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ========================================================
    # Proxy al backend Node.js
    # ========================================================
    location /api/ {
        # Proxy al backend Node.js
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;  # 👈 Pasar el Origin al backend

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No cachear respuestas
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;

        # ❌ NO añadir headers CORS aquí - el backend los maneja
        # Si añades headers CORS aquí Y en el backend, se duplican
    }

    # Endpoint de salud (útil para pruebas o monitoreo)
    location = /health {
        return 200 'OK - nginx is alive';
        add_header Content-Type text/plain;
    }

    # Redirige HTTP mal formateado a HTTPS
    error_page 497 https://$host$request_uri;
}

