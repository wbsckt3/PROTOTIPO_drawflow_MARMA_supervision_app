# Configuración de Nginx para api.50-17-36-133.sslip.io
# Copiar este archivo a /etc/nginx/sites-available/api-sslip.conf
# y crear un enlace simbólico: sudo ln -s /etc/nginx/sites-available/api-sslip.conf /etc/nginx/sites-enabled/

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name api.50-17-36-133.sslip.io;
    
    # Redirigir todo a HTTPS
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name api.50-17-36-133.sslip.io;

    # Certificados SSL (ajustar rutas según tu configuración)
    # Si usas Let's Encrypt:
    # ssl_certificate /etc/letsencrypt/live/api.50-17-36-133.sslip.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.50-17-36-133.sslip.io/privkey.pem;
    
    # Si usas certificados auto-firmados o de otro proveedor, ajusta las rutas:
    # ssl_certificate /ruta/a/cert.pem;
    # ssl_certificate_key /ruta/a/key.pem;

    # Configuración SSL básica
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # IMPORTANTE: Manejar OPTIONS ANTES de cualquier otra cosa
    location / {
        # CRÍTICO: Manejar OPTIONS (preflight) ANTES del proxy
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-user-email, x-editor-email, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy al servidor Node.js
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # Headers importantes para el proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # No cachear respuestas
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;

        # CRÍTICO: Añadir headers CORS a TODAS las respuestas (incluyendo errores)
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-user-email, x-editor-email, Accept, Origin, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Type' always;
    }

    # Logging específico para debug
    access_log /var/log/nginx/api-sslip-access.log;
    error_log /var/log/nginx/api-sslip-error.log;
}

