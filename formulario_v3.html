<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Tech Guard Pro — Servicios de Reparación</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  
  <!-- Google Sign-in -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  
  <style>
    :root{
      --primary:#1a73e8; --primary-dark:#1557b0; --secondary:#34a853; --accent:#fbbc04;
      --danger:#ea4335; --warning:#f9ab00; --success:#34a853; --info:#4285f4;
      --bg:#ffffff; --surface:#f8f9fa; --surface-variant:#e8eaed;
      --text:#202124; --text-secondary:#5f6368; --text-disabled:#9aa0a6;
      --border:#dadce0; --shadow:0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-elevated:0 4px 8px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.08);
    }
    
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    html,body{height:100%; margin:0; padding:0; overflow-x:hidden}
    body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:16px; line-height:1.5}
    
    /* Layout principal - Mobile First */
    .app{display:flex; flex-direction:column; height:100vh; max-width:100vw}
    .header{background:var(--bg); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; z-index:1000; position:relative}
    .main{flex:1; position:relative; overflow:hidden}
    .map-container{width:100%; height:100%; position:relative}
    
    /* Header móvil */
    .header-left{display:flex; align-items:center; gap:12px}
    .header-title{font-size:18px; font-weight:600; color:var(--text)}
    .header-right{display:flex; align-items:center; gap:8px}
    .user-avatar{width:32px; height:32px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:14px}
    
    /* Mapa */
    #map{width:100%; height:100%; z-index:1}
    
    /* Bottom Navigation */
    .bottom-nav{position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--border); display:flex; z-index:1000; padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
    .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 4px; text-decoration:none; color:var(--text-secondary); transition:color 0.2s}
    .nav-item.active{color:var(--primary)}
    .nav-icon{font-size:20px; margin-bottom:4px}
    .nav-label{font-size:12px; font-weight:500}
    
    /* Floating Action Button */
    .fab{position:fixed; bottom:80px; right:16px; width:56px; height:56px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; box-shadow:var(--shadow-elevated); z-index:999; border:none; cursor:pointer; transition:all 0.2s}
    .fab:hover{transform:scale(1.05); box-shadow:0 6px 12px rgba(0,0,0,0.15)}
    .fab.secondary{bottom:148px; background:var(--secondary)}
    
    /* Cards deslizables */
    .card-container{position:fixed; bottom:80px; left:0; right:0; z-index:500; padding:0 16px; pointer-events:none}
    .card{background:var(--bg); border-radius:16px; box-shadow:var(--shadow-elevated); margin-bottom:12px; pointer-events:auto; transform:translateY(100%); transition:transform 0.3s ease}
    .card.visible{transform:translateY(0)}
    .card-header{padding:16px 16px 0; display:flex; justify-content:space-between; align-items:center}
    .card-title{font-size:16px; font-weight:600; margin:0}
    .card-close{background:none; border:none; color:var(--text-secondary); font-size:20px; cursor:pointer; padding:4px}
    .card-content{padding:16px}
    
    /* Service cards */
    .service-card{display:flex; align-items:center; padding:12px; border-radius:12px; background:var(--surface); margin-bottom:8px; border:1px solid var(--border)}
    .service-icon{width:40px; height:40px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-size:18px; margin-right:12px}
    .service-info{flex:1}
    .service-name{font-weight:600; margin:0 0 4px 0; font-size:14px}
    .service-desc{color:var(--text-secondary); font-size:12px; margin:0}
    .service-price{font-weight:600; color:var(--primary); font-size:14px}
    
    /* Request cards */
    .request-card{background:var(--surface); border-radius:12px; padding:16px; margin-bottom:12px; border-left:4px solid var(--primary)}
    .request-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
    .request-title{font-weight:600; font-size:16px; margin:0}
    .request-distance{color:var(--text-secondary); font-size:12px}
    .request-desc{color:var(--text-secondary); font-size:14px; margin:0 0 12px 0}
    .request-actions{display:flex; gap:8px}
    
    /* Botones */
    .btn{background:var(--primary); color:white; border:none; border-radius:8px; padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
    .btn:hover{background:var(--primary-dark); transform:translateY(-1px)}
    .btn.secondary{background:var(--secondary)}
    .btn.outline{background:transparent; border:1px solid var(--primary); color:var(--primary)}
    .btn.small{padding:8px 12px; font-size:12px}
    .btn.full{width:100%}
    
    /* Autenticación */
    .auth-overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:9999; padding:20px}
    .auth-container{width:100%; max-width:400px}
    .auth-card{background:var(--bg); border-radius:16px; padding:32px 24px; text-align:center; box-shadow:var(--shadow-elevated)}
    .auth-header h2{font-size:24px; font-weight:700; color:var(--text); margin:0 0 8px 0}
    .auth-header p{color:var(--text-secondary); margin:0 0 24px 0; font-size:16px}
    .auth-content p{color:var(--text); margin-bottom:24px; line-height:1.6}
    .auth-footer{margin-top:24px; padding-top:16px; border-top:1px solid var(--border)}
    .auth-footer p{color:var(--text-secondary); font-size:14px; margin:0}
    
    /* Google Sign-in */
    .g_id_signin{margin:0 auto !important; display:block !important; text-align:center !important}
    
    /* Modales */
    .modal{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:1000; padding:20px}
    .modal.active{display:flex}
    .modal-content{background:var(--bg); border-radius:16px; padding:24px; width:100%; max-width:400px; max-height:80vh; overflow-y:auto}
    .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
    .modal-title{font-size:18px; font-weight:600; margin:0}
    .modal-close{background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer; padding:4px}
    
    /* Formularios */
    .form-group{margin-bottom:16px}
    .form-group label{display:block; margin-bottom:8px; font-weight:500; color:var(--text); font-size:14px}
    .form-group input, .form-group select, .form-group textarea{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:12px; font-size:16px; outline:none; transition:border-color 0.2s}
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus{border-color:var(--primary)}
    .form-group textarea{min-height:80px; resize:vertical}
    
    /* Estados */
    .status-badge{padding:4px 8px; border-radius:12px; font-size:12px; font-weight:600; text-transform:uppercase}
    .status-pending{background:rgba(249,171,0,0.1); color:var(--warning)}
    .status-accepted{background:rgba(52,168,83,0.1); color:var(--success)}
    .status-completed{background:rgba(66,133,244,0.1); color:var(--info)}
    .status-canceled{background:rgba(234,67,53,0.1); color:var(--danger)}
    
    /* Notificaciones */
    .notification{position:fixed; top:20px; left:16px; right:16px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow-elevated); z-index:1001; transform:translateY(-100px); transition:transform 0.3s ease}
    .notification.show{transform:translateY(0)}
    .notification.success{border-left:4px solid var(--success)}
    .notification.error{border-left:4px solid var(--danger)}
    .notification.warning{border-left:4px solid var(--warning)}
    .notification-content{display:flex; justify-content:space-between; align-items:center}
    .notification-close{background:none; border:none; color:var(--text-secondary); font-size:18px; cursor:pointer; padding:4px}
    
    /* Loading */
    .loading{display:inline-block; width:20px; height:20px; border:2px solid rgba(26,115,232,0.3); border-radius:50%; border-top-color:var(--primary); animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    /* Responsive - Tablet y Desktop */
    @media (min-width:768px){
      .app{max-width:480px; margin:0 auto; border:1px solid var(--border)}
      .header{padding:16px 20px}
      .header-title{font-size:20px}
      .user-avatar{width:36px; height:36px; font-size:16px}
      .fab{right:20px; bottom:100px}
      .fab.secondary{bottom:168px}
      .card-container{padding:0 20px}
    }
    
    /* Safe area para iPhone */
    @supports (padding: max(0px)) {
      .header{padding-top:max(12px, env(safe-area-inset-top))}
      .bottom-nav{padding-bottom:max(8px, env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
  <!-- Overlay de autenticación -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>🔧 Tech Guard Pro</h2>
          <p>Servicios de Reparación</p>
        </div>
        <div class="auth-content">
          <p>Encuentra técnicos cerca de ti para reparar daños en tu propiedad</p>
          <div id="g_id_onload"
               data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-size="large"
               data-theme="outline"
               data-text="sign_in_with"
               data-shape="rectangular"
               data-logo_alignment="left">
          </div>
        </div>
        <div class="auth-footer">
          <p>Acceso para clientes y técnicos</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Aplicación principal -->
  <div class="app" id="main-app" style="display:none;">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-title">🔧 Tech Guard</div>
      </div>
      <div class="header-right">
        <div class="user-avatar" id="user-avatar">U</div>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="main">
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- Floating Action Buttons -->
    <button class="fab" id="location-fab" onclick="getCurrentLocation()">📍</button>
    <button class="fab secondary" id="services-fab" onclick="showServices()">🔧</button>

    <!-- Cards deslizables -->
    <div class="card-container" id="card-container">
      <!-- Se llenará dinámicamente -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="#" class="nav-item active" data-tab="map">
        <div class="nav-icon">🗺️</div>
        <div class="nav-label">Mapa</div>
      </a>
      <a href="#" class="nav-item" data-tab="requests">
        <div class="nav-icon">📋</div>
        <div class="nav-label">Solicitudes</div>
      </a>
      <a href="#" class="nav-item" data-tab="services">
        <div class="nav-icon">🔧</div>
        <div class="nav-label">Servicios</div>
      </a>
      <a href="#" class="nav-item" data-tab="profile">
        <div class="nav-icon">👤</div>
        <div class="nav-label">Perfil</div>
      </a>
    </div>
  </div>

  <!-- Modal para agregar servicio -->
  <div class="modal" id="add-service-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Agregar Servicio</h3>
        <button class="modal-close" onclick="hideModal('add-service-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Nombre del Servicio</label>
          <input type="text" id="service-name" placeholder="Ej: Reparación de Piscinas">
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="service-description" placeholder="Describe los servicios que ofreces"></textarea>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="service-category">
            <option value="piscinas">🏊 Piscinas</option>
            <option value="zonas_comunes">🏢 Zonas Comunes</option>
            <option value="zonas_externas">🌳 Zonas Externas</option>
            <option value="oficinas">💼 Oficinas</option>
            <option value="operario">👷 Operario</option>
          </select>
        </div>
        <div class="form-group">
          <label>Precio Base (USD)</label>
          <input type="number" id="service-base-price" placeholder="50.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Precio por KM (USD)</label>
          <input type="number" id="service-price-per-km" placeholder="2.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Radio de Servicio (metros)</label>
          <input type="number" id="service-radius" placeholder="10000">
        </div>
        <button class="btn full" onclick="createService()">Crear Servicio</button>
      </div>
    </div>
  </div>

  <!-- Modal para hacer puja -->
  <div class="modal" id="bid-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Hacer Propuesta</h3>
        <button class="modal-close" onclick="hideModal('bid-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Precio Propuesto (USD)</label>
          <input type="number" id="bid-price" placeholder="75.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Tiempo Estimado (minutos)</label>
          <input type="number" id="bid-duration" placeholder="60">
        </div>
        <div class="form-group">
          <label>Comentarios</label>
          <textarea id="bid-comment" placeholder="Describe tu propuesta de solución"></textarea>
        </div>
        <button class="btn full" onclick="submitBid()">Enviar Propuesta</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Variables globales
    let map;
    let currentUser = null;
    let currentCompany = null;
    let userLocation = null;
    let userMarker = null;
    let damageMarkers = [];
    let socket = null;
    let isServiceProvider = false;
    let currentServices = [];
    let nearbyRequests = [];
    let selectedRequest = null;
    let currentTab = 'map';

    // Configuración de la API
    const API_BASE_URL = 'https://www.refactorii.com/api/tenant/geofence';
    const SOCKET_URL = 'https://www.refactorii.com';

    // Inicialización
    document.addEventListener('DOMContentLoaded', function() {
      checkAuthStatus();
      setupEventListeners();
      
      // Centrar el botón de Google después de que se cargue
      setTimeout(() => {
        const googleButton = document.querySelector('.g_id_signin');
        if (googleButton) {
          googleButton.style.margin = '0 auto';
          googleButton.style.display = 'block';
          googleButton.style.textAlign = 'center';
        }
      }, 1000);
    });

    // Configurar event listeners
    function setupEventListeners() {
      // Bottom navigation
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const tab = item.dataset.tab;
          switchTab(tab);
        });
      });

      // FAB buttons
      document.getElementById('location-fab').addEventListener('click', getCurrentLocation);
      document.getElementById('services-fab').addEventListener('click', showServices);
    }

    // Cambiar tab
    function switchTab(tab) {
      currentTab = tab;
      
      // Actualizar navegación
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      
      // Mostrar contenido correspondiente
      switch(tab) {
        case 'map':
          showMapView();
          break;
        case 'requests':
          showRequestsView();
          break;
        case 'services':
          showServicesView();
          break;
        case 'profile':
          showProfileView();
          break;
      }
    }

    // Verificar estado de autenticación
    function checkAuthStatus() {
      const token = localStorage.getItem('user_token');
      const userData = localStorage.getItem('user_data');
      
      if (token && userData) {
        try {
          currentUser = JSON.parse(userData);
          initializeApp();
        } catch (error) {
          console.error('Error parsing user data:', error);
          showAuthOverlay();
        }
      } else {
        showAuthOverlay();
      }
    }

    // Mostrar overlay de autenticación
    function showAuthOverlay() {
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
    }

    // Ocultar overlay de autenticación
    function hideAuthOverlay() {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
    }

    // Manejar respuesta de Google Sign-in
    async function handleCredentialResponse(response) {
      try {
        console.log('🔐 Iniciando autenticación con Google...');
        const credential = response.credential;
        const payload = JSON.parse(atob(credential.split('.')[1]));
        
        console.log('👤 Usuario autenticado:', payload.email, payload.name);
        
        // Crear objeto de usuario
        const userData = {
          FullName: payload.name,
          GivenName: payload.given_name,
          FamilyName: payload.family_name,
          ImageURL: payload.picture,
          Email: payload.email
        };

        // Guardar en localStorage
        localStorage.setItem('user_token', credential);
        localStorage.setItem('user_data', JSON.stringify(userData));
        
        currentUser = userData;
        initializeApp();
        
      } catch (error) {
        console.error('Error procesando credencial:', error);
        showNotification('Error en la autenticación', 'error');
      }
    }

    // Inicializar aplicación
    async function initializeApp() {
      try {
        // Obtener información de la empresa
        await loadCompanyInfo();
        
        // Configurar UI
        setupUserInterface();
        
        // Inicializar mapa
        initializeMap();
        
        // Obtener ubicación actual
        getCurrentLocation();
        
        // Conectar Socket.IO
        connectSocket();
        
        // Cargar datos iniciales
        await loadInitialData();
        
        hideAuthOverlay();
        
      } catch (error) {
        console.error('Error inicializando app:', error);
        showNotification('Error al inicializar la aplicación', 'error');
      }
    }

    // Cargar información de la empresa
    async function loadCompanyInfo() {
      try {
        const response = await fetch(`${API_BASE_URL.replace('/geofence', '')}/companies`, {
          headers: {
            'x-user-email': currentUser.Email
          }
        });
        
        if (response.ok) {
          const result = await response.json();
          currentCompany = result.data?.[0] || {
            _id: 'demo-company-id',
            name: 'Empresa Demo'
          };
        } else {
          currentCompany = {
            _id: 'demo-company-id',
            name: 'Empresa Demo'
          };
        }
      } catch (error) {
        console.warn('Error cargando empresa:', error);
        currentCompany = {
          _id: 'demo-company-id',
          name: 'Empresa Demo'
        };
      }
    }

    // Configurar interfaz de usuario
    function setupUserInterface() {
      // Configurar avatar
      const avatar = document.getElementById('user-avatar');
      if (currentUser.ImageURL) {
        avatar.style.backgroundImage = `url(${currentUser.ImageURL})`;
        avatar.style.backgroundSize = 'cover';
        avatar.textContent = '';
      } else {
        avatar.textContent = (currentUser.GivenName || 'U').charAt(0).toUpperCase();
      }
    }

    // Inicializar mapa
    function initializeMap() {
      // Crear mapa centrado en Bogotá
      map = L.map('map').setView([4.6097, -74.0817], 13);
      
      // Agregar capa de OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
      
      // Agregar marcadores de ejemplo (daños)
      addSampleDamageMarkers();
    }

    // Obtener ubicación actual
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        showNotification('Geolocalización no soportada por este navegador', 'error');
        return;
      }

      showNotification('Obteniendo ubicación...', 'info');
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy
          };
          
          // Centrar mapa en ubicación del usuario
          map.setView([userLocation.lat, userLocation.lng], 15);
          
          // Agregar marcador del usuario
          if (userMarker) {
            map.removeLayer(userMarker);
          }
          
          userMarker = L.marker([userLocation.lat, userLocation.lng], {
            icon: L.divIcon({
              className: 'user-marker',
              html: '<div style="background: #34a853; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">U</div>',
              iconSize: [24, 24],
              iconAnchor: [12, 12]
            })
          }).addTo(map);
          
          showNotification('Ubicación obtenida', 'success');
          
          // Registrar móvil si es proveedor de servicios
          if (isServiceProvider) {
            registerMobileDevice();
          }
          
          // Cargar solicitudes cercanas
          loadNearbyRequests();
          
        },
        (error) => {
          console.error('Error obteniendo ubicación:', error);
          showNotification('Error obteniendo ubicación', 'error');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 300000
        }
      );
    }

    // Agregar marcadores de daños de ejemplo
    function addSampleDamageMarkers() {
      const sampleDamages = [
        {
          id: 'damage-1',
          lat: 4.6097,
          lng: -74.0817,
          title: 'Fuga en Piscina',
          description: 'Fuga detectada en el sistema de filtración',
          image: 'https://via.placeholder.com/200x150/ea4335/ffffff?text=Fuga+Piscina',
          severity: 'high',
          category: 'piscinas',
          timestamp: new Date().toISOString()
        },
        {
          id: 'damage-2',
          lat: 4.6107,
          lng: -74.0827,
          title: 'Pintura Desgastada',
          description: 'Pintura en mal estado en zona común',
          image: 'https://via.placeholder.com/200x150/f9ab00/ffffff?text=Pintura+Desgastada',
          severity: 'medium',
          category: 'zonas_comunes',
          timestamp: new Date().toISOString()
        },
        {
          id: 'damage-3',
          lat: 4.6087,
          lng: -74.0807,
          title: 'Lámpara Fundida',
          description: 'Lámpara en oficina principal fundida',
          image: 'https://via.placeholder.com/200x150/4285f4/ffffff?text=Lámpara+Fundida',
          severity: 'low',
          category: 'oficinas',
          timestamp: new Date().toISOString()
        }
      ];

      sampleDamages.forEach(damage => {
        addDamageMarker(damage);
      });
    }

    // Agregar marcador de daño
    function addDamageMarker(damage) {
      const marker = L.marker([damage.lat, damage.lng], {
        icon: L.divIcon({
          className: 'damage-marker',
          html: `<div style="background: ${damage.severity === 'high' ? '#ea4335' : damage.severity === 'medium' ? '#f9ab00' : '#4285f4'}; color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">!</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        })
      });

      const popupContent = `
        <div style="min-width: 200px;">
          <img src="${damage.image}" alt="${damage.title}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px;">
          <div style="font-weight: 600; margin-bottom: 4px; font-size: 16px;">${damage.title}</div>
          <div style="color: #5f6368; font-size: 14px; margin-bottom: 12px;">${damage.description}</div>
          <button onclick="createServiceRequest('${damage.id}')" style="background: #1a73e8; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;">Solicitar Servicio</button>
        </div>
      `;

      marker.bindPopup(popupContent);
      marker.addTo(map);
      
      damageMarkers.push({
        marker: marker,
        data: damage
      });
    }

    // Conectar Socket.IO
    function connectSocket() {
      socket = io(SOCKET_URL);
      
      socket.on('connect', () => {
        console.log('🔌 Conectado a Socket.IO');
        socket.emit('join', currentUser.Email);
      });
      
      socket.on('disconnect', () => {
        console.log('🔌 Desconectado de Socket.IO');
      });
      
      socket.on('new_service_request', (data) => {
        console.log('📋 Nueva solicitud de servicio:', data);
        showNotification('Nueva solicitud de servicio disponible', 'info');
        loadNearbyRequests();
      });
      
      socket.on('service_request_accepted', (data) => {
        console.log('✅ Solicitud aceptada:', data);
        showNotification('Tu solicitud ha sido aceptada', 'success');
      });
    }

    // Cargar datos iniciales
    async function loadInitialData() {
      try {
        // Determinar rol del usuario
        await determineUserRole();
        
        // Cargar servicios si es proveedor
        if (isServiceProvider) {
          await loadUserServices();
        }
        
      } catch (error) {
        console.error('Error cargando datos iniciales:', error);
      }
    }

    // Determinar rol del usuario
    async function determineUserRole() {
      try {
        // Por ahora, asumimos que todos pueden ser proveedores
        isServiceProvider = true;
        
      } catch (error) {
        console.error('Error determinando rol:', error);
      }
    }

    // Cargar servicios del usuario
    async function loadUserServices() {
      try {
        const response = await fetch(`${API_BASE_URL}/companies/${currentCompany._id}/services`, {
          headers: {
            'x-user-email': currentUser.Email
          }
        });
        
        if (response.ok) {
          const result = await response.json();
          currentServices = result.data || [];
        }
      } catch (error) {
        console.error('Error cargando servicios:', error);
        // Usar servicios de ejemplo
        currentServices = [
          {
            _id: 'service-1',
            name: 'Reparación de Piscinas',
            description: 'Servicio especializado en reparación de piscinas',
            category: 'piscinas',
            pricing: { basePrice: 50, pricePerKm: 2 }
          }
        ];
      }
    }

    // Cargar solicitudes cercanas
    async function loadNearbyRequests() {
      if (!userLocation || !isServiceProvider) return;
      
      try {
        const response = await fetch(
          `${API_BASE_URL}/companies/${currentCompany._id}/mobile/nearby-providers?` +
          `latitude=${userLocation.lat}&longitude=${userLocation.lng}&maxRadius=5000`,
          {
            headers: {
              'x-user-email': currentUser.Email
            }
          }
        );
        
        if (response.ok) {
          const result = await response.json();
          nearbyRequests = result.data || [];
        }
      } catch (error) {
        console.error('Error cargando solicitudes cercanas:', error);
        // Usar datos de ejemplo
        nearbyRequests = [
          {
            id: 'request-1',
            title: 'Reparación Urgente de Piscina',
            description: 'Fuga en sistema de filtración',
            distance: '0.5 km',
            price: '$75',
            status: 'pending'
          }
        ];
      }
    }

    // Mostrar vista del mapa
    function showMapView() {
      // El mapa ya está visible
    }

    // Mostrar vista de solicitudes
    function showRequestsView() {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      
      if (nearbyRequests.length === 0) {
        container.innerHTML = `
          <div class="card visible">
            <div class="card-content">
              <p>No hay solicitudes cercanas disponibles</p>
            </div>
          </div>
        `;
        return;
      }
      
      nearbyRequests.forEach(request => {
        const requestCard = document.createElement('div');
        requestCard.className = 'card visible';
        requestCard.innerHTML = `
          <div class="card-header">
            <h3 class="card-title">${request.title}</h3>
            <button class="card-close" onclick="this.parentElement.parentElement.remove()">&times;</button>
          </div>
          <div class="card-content">
            <div class="request-card">
              <div class="request-header">
                <div class="request-title">${request.title}</div>
                <div class="request-distance">${request.distance}</div>
              </div>
              <div class="request-desc">${request.description}</div>
              <div class="request-actions">
                <button class="btn small" onclick="showBidModal('${request.id}')">Hacer Propuesta</button>
                <span class="status-badge status-${request.status}">${request.status}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(requestCard);
      });
    }

    // Mostrar vista de servicios
    function showServicesView() {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      
      if (currentServices.length === 0) {
        container.innerHTML = `
          <div class="card visible">
            <div class="card-content">
              <p>No tienes servicios registrados</p>
              <button class="btn full" onclick="showAddServiceModal()">Agregar Primer Servicio</button>
            </div>
          </div>
        `;
        return;
      }
      
      currentServices.forEach(service => {
        const serviceCard = document.createElement('div');
        serviceCard.className = 'card visible';
        serviceCard.innerHTML = `
          <div class="card-header">
            <h3 class="card-title">Mis Servicios</h3>
            <button class="card-close" onclick="this.parentElement.parentElement.remove()">&times;</button>
          </div>
          <div class="card-content">
            <div class="service-card">
              <div class="service-icon">🔧</div>
              <div class="service-info">
                <div class="service-name">${service.name}</div>
                <div class="service-desc">${service.description}</div>
              </div>
              <div class="service-price">$${service.pricing.basePrice}</div>
            </div>
            <button class="btn full" onclick="showAddServiceModal()">Agregar Servicio</button>
          </div>
        `;
        container.appendChild(serviceCard);
      });
    }

    // Mostrar vista de perfil
    function showProfileView() {
      const container = document.getElementById('card-container');
      container.innerHTML = `
        <div class="card visible">
          <div class="card-header">
            <h3 class="card-title">Mi Perfil</h3>
            <button class="card-close" onclick="this.parentElement.parentElement.remove()">&times;</button>
          </div>
          <div class="card-content">
            <div style="text-align: center; margin-bottom: 20px;">
              <div class="user-avatar" style="width: 80px; height: 80px; margin: 0 auto 12px; font-size: 32px;">${(currentUser.GivenName || 'U').charAt(0).toUpperCase()}</div>
              <h3 style="margin: 0 0 4px 0;">${currentUser.FullName}</h3>
              <p style="color: var(--text-secondary); margin: 0;">${currentUser.Email}</p>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
              <button class="btn outline" onclick="toggleServiceProvider()" style="flex: 1;">
                ${isServiceProvider ? 'Desregistrarse' : 'Registrarse como Técnico'}
              </button>
            </div>
            <button class="btn danger full" onclick="logout()">Cerrar Sesión</button>
          </div>
        </div>
      `;
    }

    // Mostrar servicios
    function showServices() {
      switchTab('services');
    }

    // Mostrar modal de puja
    function showBidModal(requestId) {
      selectedRequest = requestId;
      document.getElementById('bid-modal').classList.add('active');
    }

    // Enviar puja
    async function submitBid() {
      const price = document.getElementById('bid-price').value;
      const duration = document.getElementById('bid-duration').value;
      const comment = document.getElementById('bid-comment').value;
      
      if (!price || !duration) {
        showNotification('Por favor completa todos los campos', 'error');
        return;
      }
      
      try {
        // Aquí se enviaría la puja a la API
        console.log('Enviando puja:', { price, duration, comment, requestId: selectedRequest });
        
        showNotification('Propuesta enviada exitosamente', 'success');
        hideModal('bid-modal');
        
        // Limpiar formulario
        document.getElementById('bid-price').value = '';
        document.getElementById('bid-duration').value = '';
        document.getElementById('bid-comment').value = '';
        
      } catch (error) {
        console.error('Error enviando puja:', error);
        showNotification('Error enviando propuesta', 'error');
      }
    }

    // Crear solicitud de servicio
    async function createServiceRequest(damageId) {
      if (!userLocation) {
        showNotification('Necesitas permitir la ubicación para crear solicitudes', 'error');
        return;
      }
      
      try {
        const damage = damageMarkers.find(d => d.data.id === damageId)?.data;
        if (!damage) return;
        
        const requestData = {
          requesterId: 'demo-requester-id',
          serviceId: 'demo-service-id',
          requestLocation: {
            latitude: damage.lat,
            longitude: damage.lng
          },
          description: `Solicitud de reparación: ${damage.title}`,
          priority: damage.severity === 'high' ? 'high' : 'medium'
        };
        
        const response = await fetch(`${API_BASE_URL}/companies/${currentCompany._id}/service-requests`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': currentUser.Email
          },
          body: JSON.stringify(requestData)
        });
        
        if (response.ok) {
          showNotification('Solicitud de servicio creada', 'success');
        } else {
          throw new Error('Error creando solicitud');
        }
        
      } catch (error) {
        console.error('Error creando solicitud:', error);
        showNotification('Error creando solicitud de servicio', 'error');
      }
    }

    // Mostrar modal para agregar servicio
    function showAddServiceModal() {
      document.getElementById('add-service-modal').classList.add('active');
    }

    // Crear servicio
    async function createService() {
      const name = document.getElementById('service-name').value;
      const description = document.getElementById('service-description').value;
      const category = document.getElementById('service-category').value;
      const basePrice = parseFloat(document.getElementById('service-base-price').value);
      const pricePerKm = parseFloat(document.getElementById('service-price-per-km').value);
      const radius = parseInt(document.getElementById('service-radius').value);
      
      if (!name || !description || !basePrice || !pricePerKm || !radius) {
        showNotification('Por favor completa todos los campos', 'error');
        return;
      }
      
      try {
        const serviceData = {
          name,
          description,
          category,
          pricing: {
            basePrice,
            pricePerKm,
            currency: 'USD'
          },
          serviceRadius: radius
        };
        
        const response = await fetch(`${API_BASE_URL}/companies/${currentCompany._id}/services`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': currentUser.Email
          },
          body: JSON.stringify(serviceData)
        });
        
        if (response.ok) {
          showNotification('Servicio creado exitosamente', 'success');
          hideModal('add-service-modal');
          loadUserServices();
          
          // Limpiar formulario
          document.getElementById('service-name').value = '';
          document.getElementById('service-description').value = '';
          document.getElementById('service-base-price').value = '';
          document.getElementById('service-price-per-km').value = '';
          document.getElementById('service-radius').value = '';
        } else {
          throw new Error('Error creando servicio');
        }
        
      } catch (error) {
        console.error('Error creando servicio:', error);
        showNotification('Error creando servicio', 'error');
      }
    }

    // Registrar dispositivo móvil
    async function registerMobileDevice() {
      if (!userLocation) return;
      
      try {
        const deviceData = {
          deviceId: 'web-' + Date.now(),
          name: currentUser.FullName,
          latitude: userLocation.lat,
          longitude: userLocation.lng,
          accuracy: userLocation.accuracy,
          isServiceProvider: isServiceProvider,
          services: currentServices.map(s => s._id),
          preferences: {
            notifications: true,
            categories: ['piscinas', 'zonas_comunes', 'zonas_externas', 'oficinas', 'operario'],
            maxRadius: 10000
          }
        };
        
        const response = await fetch(`${API_BASE_URL}/companies/${currentCompany._id}/mobile/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': currentUser.Email
          },
          body: JSON.stringify(deviceData)
        });
        
        if (response.ok) {
          console.log('Dispositivo móvil registrado');
        }
        
      } catch (error) {
        console.error('Error registrando dispositivo:', error);
      }
    }

    // Alternar estado de proveedor de servicios
    function toggleServiceProvider() {
      isServiceProvider = !isServiceProvider;
      
      if (isServiceProvider) {
        showNotification('Registrado como técnico', 'success');
        
        if (userLocation) {
          registerMobileDevice();
          loadNearbyRequests();
        }
      } else {
        showNotification('Desregistrado como técnico', 'info');
      }
    }

    // Mostrar notificación
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        <div class="notification-content">
          <div>${message}</div>
          <button class="notification-close" onclick="this.parentElement.parentElement.remove()">&times;</button>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Mostrar con animación
      setTimeout(() => {
        notification.classList.add('show');
      }, 100);
      
      // Auto-remover después de 4 segundos
      setTimeout(() => {
        if (notification.parentElement) {
          notification.classList.remove('show');
          setTimeout(() => {
            if (notification.parentElement) {
              notification.remove();
            }
          }, 300);
        }
      }, 4000);
    }

    // Ocultar modal
    function hideModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Cerrar sesión
    function logout() {
      localStorage.removeItem('user_token');
      localStorage.removeItem('user_data');
      currentUser = null;
      showAuthOverlay();
      
      if (socket) {
        socket.disconnect();
      }
    }
  </script>
